body{margin:0;background:#171009;color:var(--on-desk);font-family:'Inter',system-ui,sans-serif;font-size:15px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #f3c77e;outline-offset:2px}

/* ---------- панель прототипа ---------- */
.proto-bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 20px;border-bottom:1px solid #3a2c1e;background:#1d150d}
.proto-bar h1{font-family:'Caveat',cursive;font-size:28px;margin:0 8px 0 0;font-weight:700}
.seg{display:inline-flex;border:1px solid #4a3a28;border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--on-desk-soft);padding:6px 14px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--on-desk);color:var(--ink);font-weight:600}
.proto-bar label{font-size:13px;color:var(--on-desk-soft);display:flex;gap:8px;align-items:center}
.proto-bar select{background:#2b2015;color:var(--on-desk);border:1px solid #4a3a28;border-radius:8px;padding:5px 8px}
.stage-wrap{padding:28px 20px 60px;display:flex;justify-content:center;overflow-x:auto}

/* ---------- устройство ---------- */
.device{background:linear-gradient(160deg,var(--desk),var(--desk-2));border-radius:18px;box-shadow:0 30px 80px -30px #000;overflow:hidden;flex:none;position:relative}
.device.desktop{width:1280px;height:800px;display:grid;grid-template-columns:232px 1fr}
.device.mobile{width:390px;height:844px;display:flex;flex-direction:column;border-radius:34px;border:8px solid #0d0905}
.device.full{grid-template-columns:1fr}
.view{overflow:auto;position:relative;flex:1;min-height:0}
.device.desktop .view{padding:36px 48px}
.device.mobile .view{padding:18px 16px 20px}

/* боковое меню (desktop) */
.side{display:none;flex-direction:column;gap:4px;padding:28px 18px;border-right:1px solid rgba(240,233,219,.08);background:rgba(0,0,0,.14)}
.device.desktop:not(.full) .side{display:flex}
.brand{font-family:'Caveat',cursive;font-weight:700;font-size:34px;line-height:1;color:var(--paper);margin:0 0 22px 6px}
.nav-btn{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--on-desk-soft);padding:10px 12px;border-radius:10px;text-align:left;font-size:14px}
.nav-btn:hover{background:rgba(240,233,219,.06);color:var(--on-desk)}
.nav-btn[aria-current="page"]{background:rgba(240,233,219,.1);color:var(--on-desk);font-weight:600}
.nav-btn .ico{width:22px;text-align:center}
.nav-badge{margin-left:auto;background:var(--amber);color:#1d140a;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:#a8977b;line-height:1.5}
.side-foot button{margin-top:10px;width:100%}

/* нижняя панель (mobile) */
.topbar{display:none;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.device.mobile:not(.full) .topbar{display:flex}
.topbar .brand{font-size:28px;margin:0}
.tabs{display:none;border-top:1px solid rgba(240,233,219,.1);background:#1f160d}
.device.mobile:not(.full) .tabs{display:flex}
.tab{flex:1;background:none;border:0;color:#a8977b;padding:10px 4px 14px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .ico{font-size:19px}
.tab[aria-current="page"]{color:var(--on-desk);font-weight:600}

/* ---------- общие элементы ---------- */
h2.page{font-family:'Caveat',cursive;font-weight:700;font-size:40px;margin:0 0 4px;line-height:1.05}
.device.mobile h2.page{font-size:34px}
.lead{color:var(--on-desk-soft);margin:0 0 24px;font-size:14px;line-height:1.5}
.btn{border:0;border-radius:var(--r-ctl);padding:12px 18px;font-weight:600;font-size:14px;color:#fff;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sage{background:var(--sage-deep)}
.btn.amber{background:var(--amber-deep)}
.btn.ghost{background:none;border:1px solid rgba(240,233,219,.3);color:var(--on-desk)}
.btn.paper-ghost{background:none;border:1px solid #bfb193;color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.paper{background:repeating-linear-gradient(to bottom,transparent 0 35px,var(--line) 35px 36px),var(--paper);color:var(--ink);border-radius:var(--r-card);box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft)}
.muted{color:var(--on-desk-soft)}

/* ---------- экран приветствия ---------- */
.welcome{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
.welcome .stack{position:relative;width:250px;height:170px;margin:0 auto 34px}
.welcome .stack .paper{position:absolute;inset:0;display:grid;place-items:center}
.welcome .stack .paper:nth-child(1){transform:rotate(-7deg) translate(-14px,8px);opacity:.55}
.welcome .stack .paper:nth-child(2){transform:rotate(5deg) translate(12px,4px);opacity:.75}
.welcome .stack .word{font-size:34px;font-weight:700;letter-spacing:-.01em}
.welcome .stack .ru{font-family:'Caveat',cursive;font-size:26px;color:var(--ink-blue);margin-top:-6px}
.welcome h2{font-family:'Caveat',cursive;font-size:52px;margin:0 0 8px;line-height:1}
.welcome p{max-width:380px;margin:0 auto 26px;color:var(--on-desk-soft);line-height:1.55}
.welcome .actions{display:flex;flex-direction:column;gap:10px;width:min(320px,100%);margin:0 auto}

/* ---------- кабинет ---------- */
.home-grid{display:grid;gap:22px}
.device.desktop .home-grid{grid-template-columns:340px 1fr;align-items:start}
.badge{padding:18px 20px 20px;position:relative}
.badge .clip{position:absolute;top:-9px;left:50%;width:54px;height:16px;margin-left:-27px;border-radius:5px;background:#7b6a52;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.badge .who{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.badge .photo{width:54px;height:62px;border-radius:6px;background:var(--paper-2);display:grid;place-items:center;font-family:'Caveat',cursive;font-size:30px;color:var(--ink-soft)}
.badge .role{font-family:'Caveat',cursive;font-weight:700;font-size:34px;line-height:1;color:var(--ink-blue)}
.badge .name{font-size:13px;color:var(--ink-soft);margin-top:4px}
.xp-row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.xp{height:8px;background:var(--paper-2);border-radius:99px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--sage));border-radius:99px;transition:width .5s}
.streak{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-soft)}
.streak b{color:var(--ink);font-size:15px}
.inbox{padding:18px 20px;margin-top:22px;display:flex;flex-direction:column;gap:12px}
.inbox h3{margin:0;font-size:15px}
.inbox p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.45}
.depts h3{margin:0 0 12px;font-size:15px;color:var(--on-desk-soft);font-weight:600}
.dept-list{display:grid;gap:14px}
.device.desktop .dept-list{grid-template-columns:1fr 1fr}
.dept{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.dept.locked{background:rgba(240,233,219,.06);color:var(--on-desk-soft);box-shadow:none;border:1px dashed rgba(240,233,219,.22)}
.dept .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dept .title{font-weight:700;font-size:16px}
.dept .count{font-size:12px;color:var(--ink-soft)}
.dept.locked .count{color:inherit}
.dept .bar{height:5px;background:var(--paper-2);border-radius:9px;overflow:hidden}
.dept .bar i{display:block;height:100%;background:var(--sage)}
.dept .row{display:flex;gap:8px}
.dept .row .btn{flex:1;padding:9px 10px;font-size:13px}
.dept .why{font-size:12.5px;line-height:1.45}

/* ---------- карточки ---------- */
.study{display:flex;flex-direction:column;align-items:center}
.study-head{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--on-desk-soft);margin-bottom:10px}
.track{width:100%;max-width:520px;height:3px;background:rgba(240,233,219,.12);border-radius:3px;margin-bottom:26px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--sage))}
.flip{width:330px;height:400px;perspective:1400px;cursor:pointer;margin-bottom:22px}
.device.mobile .flip{width:100%;max-width:330px;height:380px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;padding:24px 22px 22px 40px;display:flex;flex-direction:column}
.face::before{content:"";position:absolute;top:0;bottom:0;left:24px;width:1.5px;background:#c1443b;opacity:.5}
.face.back{transform:rotateY(180deg);justify-content:center}
.face .tag{align-self:flex-end;font-size:11px;padding:3px 9px;border-radius:99px;background:#6b5d8f;color:#fff}
.face .en{font-size:46px;font-weight:700;letter-spacing:-.02em;margin:auto 0 6px}
.face .ipa{font-size:15px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;margin-bottom:auto}
.say{border:1px solid #bfb193;background:none;border-radius:99px;width:32px;height:32px;display:grid;place-items:center;font-size:14px}
.face .hint{font-size:12px;color:var(--ink-soft)}
.face .ru{font-family:'Caveat',cursive;font-weight:700;font-size:44px;color:var(--ink-blue);line-height:1;margin-bottom:14px}
.face .ex{font-size:14px;line-height:1.5;color:var(--ink-soft);font-style:italic}
.study .controls{display:flex;gap:12px}
.study .note{font-size:12px;color:#a8977b;margin-top:12px;text-align:center}

/* ---------- Дедлайн ---------- */
.game{max-width:560px;margin:0 auto}
.timer{height:10px;border-radius:99px;background:rgba(240,233,219,.12);overflow:hidden;margin:6px 0 20px}
.timer i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
.timer.low i{background:var(--red)}
.game-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--on-desk-soft)}
.game-head b{color:var(--on-desk);font-size:15px}
.q{padding:26px 26px 22px;text-align:center;margin-bottom:18px}
.q .lbl{font-size:12px;color:var(--ink-soft)}
.q .en{font-size:44px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.opts{display:grid;gap:10px}
.device.desktop .opts{grid-template-columns:1fr 1fr}
.opt{background:rgba(240,233,219,.07);border:1px solid rgba(240,233,219,.2);color:var(--on-desk);border-radius:var(--r-ctl);padding:14px;text-align:left;font-size:15px}
.opt:hover:not(:disabled){background:rgba(240,233,219,.13)}
.opt.ok{background:var(--sage-deep);border-color:var(--sage-deep)}
.opt.bad{background:var(--red);border-color:var(--red)}
.opt:disabled{cursor:default}
.feedback{min-height:24px;margin-top:14px;font-size:14px;text-align:center}
.combo{color:#f3c77e;font-weight:600}

/* ---------- итоги ---------- */
.result{max-width:460px;margin:10px auto 0;padding:30px 28px;text-align:center}
.result h2{font-family:'Caveat',cursive;font-size:44px;margin:0;line-height:1}
.result .score{font-size:15px;color:var(--ink-soft);margin:8px 0 18px}
.promo{border:2px dashed var(--sage);border-radius:12px;padding:14px;margin:0 0 18px;background:rgba(110,139,99,.1)}
.promo .role{font-family:'Caveat',cursive;font-size:32px;color:var(--ink-blue);font-weight:700}
.save-note{background:var(--paper-2);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;text-align:left;margin-bottom:16px}
.result .actions{display:flex;flex-direction:column;gap:10px}

/* ---------- регистрация ---------- */
.auth{height:100%;display:grid;place-items:center;padding:24px}
.auth .paper{width:min(420px,100%);padding:30px 28px 26px}
.auth h2{font-family:'Caveat',cursive;font-size:42px;margin:0 0 4px;line-height:1}
.auth p.sub{font-size:13px;color:var(--ink-soft);margin:0 0 20px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid #bfb193;background:#fffaf0;color:var(--ink)}
.field.err input{border-color:var(--red)}
.field .msg{font-size:12px;color:var(--red)}
.carry{display:flex;gap:10px;align-items:flex-start;font-size:13px;background:var(--paper-2);padding:10px 12px;border-radius:8px;margin-bottom:16px;line-height:1.4}
.switch-link{background:none;border:0;color:var(--ink-blue);text-decoration:underline;font-size:13px;margin-top:12px;padding:4px}

/* ---------- профиль ---------- */
.ladder{display:flex;flex-direction:column-reverse;gap:6px;margin-top:6px}
.rung{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-radius:9px;font-size:14px;background:rgba(240,233,219,.05);color:#a8977b;border:1px solid rgba(240,233,219,.1)}
.rung.done{color:var(--on-desk-soft)}
.rung.now{background:var(--paper);color:var(--ink);font-weight:700;border-color:transparent}
.rung .pts{font-size:12px;font-weight:400}
.prof-grid{display:grid;gap:22px}
.device.desktop .prof-grid{grid-template-columns:1fr 1fr}
.panel{padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:15px}
.week{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;background:var(--sage);border-radius:4px 4px 0 0}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach div{text-align:center;font-size:12px;color:var(--ink-soft);padding:10px 4px;border-radius:10px;background:var(--paper-2)}
.ach div.off{opacity:.4}
.ach b{display:block;font-size:22px;margin-bottom:4px}

/* ---------- админ ---------- */
.adm-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.adm-tools input,.adm-tools select{font:inherit;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid #4a3a28;background:#2b2015;color:var(--on-desk)}
.adm-tools input{flex:1;min-width:160px}
.tbl-wrap{overflow-x:auto;border-radius:12px}
table.words{width:100%;border-collapse:collapse;background:var(--paper);color:var(--ink);font-size:14px}
table.words th{text-align:left;font-size:12px;color:var(--ink-soft);font-weight:600;padding:10px 14px;background:var(--paper-2)}
table.words td{padding:10px 14px;border-top:1px solid #e0d5b8;vertical-align:top}
table.words td.ex{color:var(--ink-soft);font-style:italic;max-width:300px}
.st{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.pub{background:#dfe8d9;color:#2f4a29}
.st.draft{background:#f1e0c4;color:#6e4613}
.link{background:none;border:0;color:var(--ink-blue);text-decoration:underline;padding:0;font-size:13px}
.mcards{display:flex;flex-direction:column;gap:10px}
.mcard{padding:14px 16px}
.mcard .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mcard .en{font-weight:700;font-size:16px}
.mcard .ru{font-size:14px;color:var(--ink-soft)}
.mcard .l2{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.modal-bg{position:absolute;inset:0;background:rgba(10,6,2,.6);display:grid;place-items:center;padding:16px;z-index:5}
.modal{width:min(480px,100%);padding:24px 24px 20px;max-height:100%;overflow:auto}
.device.desktop .modal{width:580px}
.modal h3{font-family:'Caveat',cursive;font-size:34px;margin:0 0 12px;line-height:1}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .acts{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:6px}
.modal .row2 .field input{min-width:0;width:100%}
.device.mobile .modal .row2{grid-template-columns:1fr;gap:0}
.device.mobile .modal .acts .btn{flex:1 1 100%}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px -10px #000;z-index:6}
.device.mobile .toast{bottom:84px}

@media (prefers-reduced-motion: reduce){.flip-inner,.xp i,.timer i,.btn{transition:none!important}}
</style>
</head>
<body>
<div class="proto-bar">
  <h1>Vocab Deck · прототип</h1>
  <div class="seg" role="group" aria-label="Формат">
    <button data-dev="desktop" aria-pressed="true">Компьютер</button>
    <button data-dev="mobile" aria-pressed="false">Телефон</button>
  </div>
  <label>Роль
    <select id="roleSel">
      <option value="guest">Гость</option>
      <option value="user">Пользователь</option>
      <option value="admin">Администратор</option>
    </select>
  </label>
  <label>Экран
    <select id="screenSel">
      <option value="welcome">1. Приветствие</option>
      <option value="home">2. Кабинет</option>
      <option value="cards">3. Карточки</option>
      <option value="game">4. Мини-игра «Дедлайн»</option>
      <option value="result">5. Итоги раунда</option>
      <option value="register">6. Регистрация</option>
      <option value="profile">7. Профиль</option>
      <option value="admin">8. Управление словами</option>
    </select>
  </label>
</div>

<div class="stage-wrap">
  <div class="device desktop" id="device">
    <nav class="side" id="side" aria-label="Основное меню"></nav>
    <div class="topbar" id="topbar"></div>
    <main class="view" id="view"></main>
    <nav class="tabs" id="tabs" aria-label="Основное меню"></nav>
  </div>
</div>

<script>
const WORDS=[
 {en:"negotiate",ipa:"/nɪˈɡəʊʃieɪt/",ru:"вести переговоры",ex:"We need to negotiate a better price.",dept:"Переговоры",st:"pub"},
 {en:"deadline",ipa:"/ˈdedlaɪn/",ru:"крайний срок",ex:"We need to meet the deadline on Friday.",dept:"Офис",st:"pub"},
 {en:"colleague",ipa:"/ˈkɒliːɡ/",ru:"коллега",ex:"My colleague helped me with the report.",dept:"Офис",st:"pub"},
 {en:"schedule",ipa:"/ˈʃedjuːl/",ru:"расписание",ex:"Can you check my schedule for tomorrow?",dept:"Офис",st:"pub"},
 {en:"remote",ipa:"/rɪˈməʊt/",ru:"удалённый",ex:"I work remotely three days a week.",dept:"Офис",st:"draft"},
 {en:"contract",ipa:"/ˈkɒntrækt/",ru:"контракт",ex:"They signed the contract yesterday.",dept:"Переговоры",st:"pub"},
 {en:"interview",ipa:"/ˈɪntəvjuː/",ru:"собеседование",ex:"The interview went really well.",dept:"Собеседование",st:"pub"},
 {en:"luggage",ipa:"/ˈlʌɡɪdʒ/",ru:"багаж",ex:"I lost my luggage at the airport.",dept:"Командировка",st:"pub"},
];
const GAME=[
 {en:"negotiate",opts:["вести переговоры","договор","откладывать","уточнять"],a:0},
 {en:"deadline",opts:["совещание","крайний срок","отчёт","расписание"],a:1},
 {en:"colleague",opts:["клиент","руководитель","коллега","сотрудник отдела кадров"],a:2},
 {en:"contract",opts:["контракт","бюджет","скидка","счёт"],a:0},
 {en:"schedule",opts:["задача","расписание","отпуск","смена"],a:1},
];
const LADDER=[
 {t:"Стажёр",xp:0},{t:"Младший специалист",xp:300},{t:"Специалист",xp:800},
 {t:"Старший специалист",xp:1600},{t:"Руководитель отдела",xp:3000},{t:"Директор",xp:5000}];

const S={dev:"desktop",role:"guest",screen:"welcome",xp:240,streak:4,flip:false,cardIdx:0,
  game:null,lastRound:null,regErr:false,modal:null,toast:null,filter:"",deptF:"all"};

const $=s=>document.querySelector(s);
const dev=$("#device"),view=$("#view");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function levelOf(xp){let i=0;LADDER.forEach((l,k)=>{if(xp>=l.xp)i=k});return i}
const FULL=["welcome","register"];

function go(screen){S.screen=screen;S.modal=null;if(screen==="cards"){S.flip=false}if(screen==="game")startGame();render()}
function setRole(r){S.role=r;$("#roleSel").value=r;if(S.screen==="admin"&&r!=="admin")S.screen="home";render()}

/* ---------- навигация ---------- */
function navItems(){
  const it=[{k:"home",i:"🗂",t:"Кабинет"},{k:"cards",i:"🃏",t:"Входящие",badge:8},{k:"profile",i:"🪪",t:"Профиль"}];
  if(S.role==="admin")it.push({k:"admin",i:"🛠",t:"Слова"});
  return it;
}
function renderNav(){
  const items=navItems();
  $("#side").innerHTML=`<div class="brand">Vocab Deck</div>`+
    items.map(n=>`<button class="nav-btn" data-go="${n.k}" ${S.screen===n.k?'aria-current="page"':''}><span class="ico">${n.i}</span>${n.t}${n.badge?`<span class="nav-badge">${n.badge}</span>`:''}</button>`).join("")+
    `<div class="side-foot">${S.role==="guest"
      ?`Вы учитесь как гость. Прогресс хранится только в этом браузере.<button class="btn sage" data-go="register">Сохранить прогресс</button>`
      :`Вход выполнен: ${S.role==="admin"?"admin@vocabdeck":"anna.k@mail.ru"}<br><button class="btn ghost" data-act="logout">Выйти</button>`}</div>`;
  $("#tabs").innerHTML=items.map(n=>`<button class="tab" data-go="${n.k}" ${S.screen===n.k?'aria-current="page"':''}><span class="ico">${n.i}</span>${n.t}</button>`).join("");
  $("#topbar").innerHTML=`<div class="brand">Vocab Deck</div>${S.role==="guest"?`<button class="btn sage" style="padding:8px 12px;font-size:13px" data-go="register">Сохранить</button>`:`<span class="chip" style="background:rgba(240,233,219,.1);color:var(--on-desk-soft)">🔥 ${S.streak}</span>`}`;
}

/* ---------- экраны ---------- */
const screens={
welcome:()=>`<section class="welcome"><div>
  <div class="stack" aria-hidden="true">
    <div class="paper"></div><div class="paper"></div>
    <div class="paper"><div><div class="word">deadline</div><div class="ru">крайний срок</div></div></div>
  </div>
  <h2>Английский для работы</h2>
  <p>Учите деловую лексику по карточкам и проходите путь от стажёра до директора. Первые слова — без регистрации.</p>
  <div class="actions">
    <button class="btn sage block" data-act="startGuest">Начать без регистрации</button>
    <button class="btn ghost block" data-act="toLogin">У меня есть аккаунт</button>
  </div></div></section>`,

home:()=>{const lv=levelOf(S.xp),cur=LADDER[lv],nxt=LADDER[lv+1];
 const pct=nxt?Math.round((S.xp-cur.xp)/(nxt.xp-cur.xp)*100):100;
 return `<h2 class="page">Кабинет</h2><p class="lead">Сегодня на столе 8 карточек на повторение и два открытых отдела.</p>
 <div class="home-grid">
  <div>
   <div class="paper badge"><div class="clip"></div>
    <div class="who"><div class="photo">${S.role==="guest"?"?":"А"}</div>
     <div><div class="role">${cur.t}</div><div class="name">${S.role==="guest"?"Гость · пропуск временный":S.role==="admin"?"Администратор контента":"Анна К."}</div></div></div>
    <div class="xp-row"><span>${S.xp} опыта</span><span>${nxt?`до «${nxt.t}»: ${nxt.xp-S.xp}`:"вершина карьеры"}</span></div>
    <div class="xp"><i style="width:${pct}%"></i></div>
    <div class="streak">🔥 <span><b>${S.streak} дня</b> подряд · заморозок в запасе: 1</span></div>
   </div>
   <div class="paper inbox"><h3>Входящие на сегодня</h3>
    <p>8 слов пора повторить, чтобы они не забылись. Займёт около 3 минут.</p>
    <button class="btn amber" data-go="cards">Разобрать входящие</button></div>
  </div>
  <div class="depts"><h3>Отделы</h3><div class="dept-list">
   ${dept("Офис",18,30)}${dept("Переговоры",5,25)}
   ${lockDept("Собеседование","Откроется, когда вы выучите 20 слов в отделе «Офис»")}
   ${lockDept("Командировка","Откроется на должности «Специалист»")}
  </div></div>
 </div>`},

cards:()=>{const w=WORDS[S.cardIdx%4];return `<div class="study">
 <div class="study-head"><span>Входящие · ${S.cardIdx+1} из 8</span><span>тренировка без очков</span></div>
 <div class="track"><i style="width:${(S.cardIdx)/8*100}%"></i></div>
 <div class="flip ${S.flip?"on":""}" id="flip" tabindex="0" role="button" aria-label="Перевернуть карточку">
  <div class="flip-inner">
   <div class="face front paper"><span class="tag">${w.dept}</span>
    <div class="en">${esc(w.en)}</div>
    <div class="ipa">${w.ipa}<button class="say" data-act="say" aria-label="Прослушать">🔊</button></div>
    <div class="hint">Нажмите на карточку, чтобы увидеть перевод</div></div>
   <div class="face back paper"><div class="ru">${esc(w.ru)}</div><div class="ex">${esc(w.ex)}</div></div>
  </div></div>
 <div class="controls">
  <button class="btn amber" data-act="sort">📥 Ещё учить</button>
  <button class="btn sage" data-act="sort">✅ Помню</button></div>
 <p class="note">Опыт начисляется только в мини-играх, где ответ проверяет приложение</p></div>`},

game:()=>{const g=S.game,q=GAME[g.i];return `<div class="game">
 <div class="game-head"><span>Дедлайн · отдел «Офис»</span><span>вопрос ${g.i+1} из ${GAME.length} · <b>${g.xp} опыта</b></span></div>
 <div class="timer ${g.t<=10?"low":""}" role="progressbar" aria-label="Осталось секунд" aria-valuenow="${g.t}" aria-valuemin="0" aria-valuemax="60"><i style="width:${g.t/60*100}%"></i></div>
 <div class="paper q"><div class="lbl">Выберите перевод · осталось ${g.t} с</div><div class="en">${q.en}</div></div>
 <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${g.pick!=null?(k===q.a?"ok":k===g.pick?"bad":""):""}" data-opt="${k}" ${g.pick!=null?"disabled":""}>${o}</button>`).join("")}</div>
 <div class="feedback" aria-live="polite">${g.pick==null?"":g.pick===q.a?`Верно, +${g.lastGain} опыта ${g.combo>1?`<span class="combo">· серия ×${g.combo}</span>`:""}`:`Правильно: «${q.opts[q.a]}». Слово вернётся во входящие завтра`}</div>
</div>`},

result:()=>{const r=S.lastRound||{ok:4,total:5,gain:50,before:240,after:290};
 const up=levelOf(r.after)>levelOf(r.before);
 return `<div class="paper result"><h2>Раунд завершён</h2>
 <div class="score">Верно ${r.ok} из ${r.total} · +${r.gain} опыта</div>
 ${up?`<div class="promo">Повышение! Теперь вы<div class="role">${LADDER[levelOf(r.after)].t}</div></div>`:`<p class="score">До повышения осталось ${LADDER[levelOf(r.after)+1].xp-r.after} опыта</p>`}
 ${S.role==="guest"?`<div class="save-note">Вы учитесь как гость: прогресс хранится только в этом браузере. Зарегистрируйтесь, чтобы не потерять ${r.after} опыта и открывать приложение на любом устройстве.</div>`:""}
 <div class="actions">
  ${S.role==="guest"?`<button class="btn sage block" data-go="register">Сохранить прогресс</button>`:""}
  <button class="btn ${S.role==="guest"?"paper-ghost":"sage"} block" data-go="game">Сыграть ещё раунд</button>
  <button class="btn paper-ghost block" data-go="home">В кабинет</button></div></div>`},

register:()=>`<section class="auth"><div class="paper">
 <h2>Сохранить прогресс</h2><p class="sub">Аккаунт нужен, чтобы учиться с любого устройства и не потерять опыт при очистке браузера.</p>
 <div class="field"><label for="rn">Имя</label><input id="rn" value="Анна" autocomplete="given-name"></div>
 <div class="field ${S.regErr?"err":""}"><label for="re">Электронная почта</label><input id="re" type="email" value="${S.regErr?"anna.k@mail":"anna.k@mail.ru"}" autocomplete="email">${S.regErr?`<span class="msg">Укажите почту в формате name@example.ru</span>`:""}</div>
 <div class="field"><label for="rp">Пароль</label><input id="rp" type="password" value="password12" autocomplete="new-password"><span style="font-size:12px;color:var(--ink-soft)">Не короче 8 символов</span></div>
 <label class="carry"><input type="checkbox" checked> <span>Перенести в аккаунт прогресс гостя: 12 слов, ${S.xp} опыта, серия ${S.streak} дня</span></label>
 <button class="btn sage block" data-act="register">Создать аккаунт</button>
 <div style="text-align:center"><button class="switch-link" data-act="regErr">Показать ошибку ввода</button> · <button class="switch-link" data-go="home">Продолжить как гость</button></div>
</div></section>`,

profile:()=>{const lv=levelOf(S.xp);const days=[["пн",12],["вт",20],["ср",8],["чт",0],["пт",26],["сб",15],["вс",18]];
 return `<h2 class="page">Профиль</h2><p class="lead">${S.role==="guest"?"Гостевой профиль. После регистрации статистика сохранится на сервере.":"Карьерная лестница, статистика и достижения."}</p>
 <div class="prof-grid">
  <div><h3 style="margin:0 0 8px;font-size:15px;color:var(--on-desk-soft)">Карьерная лестница</h3>
   <div class="ladder">${LADDER.map((l,k)=>`<div class="rung ${k<lv?"done":k===lv?"now":""}"><span>${k<lv?"✓ ":""}${l.t}</span><span class="pts">${l.xp} опыта</span></div>`).join("")}</div></div>
  <div style="display:grid;gap:18px">
   <div class="paper panel"><h3>Слов проверено за неделю</h3>
    <div class="week">${days.map(([d,v])=>`<div><i style="height:${v*3.4}px" title="${v}"></i>${d}</div>`).join("")}</div></div>
   <div class="paper panel"><h3>Достижения</h3><div class="ach">
    <div><b>🔥</b>7 дней подряд</div><div><b>🎯</b>Раунд без ошибок</div><div class="off"><b>🤝</b>Отдел «Переговоры»</div></div></div>
  </div></div>`},

admin:()=>{const list=WORDS.filter(w=>(S.deptF==="all"||w.dept===S.deptF)&&(w.en+w.ru).toLowerCase().includes(S.filter.toLowerCase()));
 const rows=list.map((w,i)=>`<tr><td><b>${esc(w.en)}</b></td><td>${esc(w.ru)}</td><td>${w.dept}</td><td class="ex">${esc(w.ex)}</td><td><span class="st ${w.st}">${w.st==="pub"?"опубликовано":"черновик"}</span></td><td><button class="link" data-edit="${WORDS.indexOf(w)}">Изменить</button></td></tr>`).join("");
 const mcards=list.map(w=>`<div class="paper mcard"><div class="l1"><span class="en">${esc(w.en)}</span><span class="st ${w.st}">${w.st==="pub"?"опубликовано":"черновик"}</span></div><div class="ru">${esc(w.ru)} · ${w.dept}</div><div class="l2"><span class="chip">${w.ipa}</span><button class="link" data-edit="${WORDS.indexOf(w)}">Изменить</button></div></div>`).join("");
 return `<h2 class="page">Слова общей колоды</h2><p class="lead">${WORDS.length} слов · изменения видят все пользователи после публикации.</p>
 <div class="adm-tools">
  <input id="q" placeholder="Поиск по слову или переводу" value="${esc(S.filter)}" aria-label="Поиск">
  <select id="df" aria-label="Отдел"><option value="all">Все отделы</option>${["Офис","Переговоры","Собеседование","Командировка"].map(d=>`<option ${S.deptF===d?"selected":""}>${d}</option>`).join("")}</select>
  <button class="btn sage" data-act="add">+ Добавить слово</button></div>
 ${list.length===0?`<p class="muted">Ничего не найдено. Измените запрос или добавьте слово.</p>`:
  S.dev==="desktop"?`<div class="tbl-wrap"><table class="words"><thead><tr><th>Слово</th><th>Перевод</th><th>Отдел</th><th>Пример</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="mcards">${mcards}</div>`}
 ${S.modal!=null?modal():""}`},
};
function dept(t,d,n){return `<div class="paper dept"><div class="top"><span class="title">${t}</span><span class="count">${d} из ${n} слов</span></div>
 <div class="bar"><i style="width:${d/n*100}%"></i></div>
 <div class="row"><button class="btn paper-ghost" data-go="cards">Карточки</button><button class="btn amber" data-go="game">Дедлайн</button></div></div>`}
function lockDept(t,why){return `<div class="dept locked"><div class="top"><span class="title">🔒 ${t}</span></div><div class="why">${why}</div></div>`}
function modal(){const w=S.modal>=0?WORDS[S.modal]:{en:"",ipa:"",ru:"",ex:"",dept:"Офис"};
 return `<div class="modal-bg"><div class="paper modal" role="dialog" aria-modal="true" aria-label="Карточка слова">
 <h3>${S.modal>=0?"Изменить слово":"Новое слово"}</h3>
 <div class="row2"><div class="field"><label>Слово (EN)</label><input value="${esc(w.en)}"></div><div class="field"><label>Транскрипция</label><input value="${esc(w.ipa)}" placeholder="/ˈwɜːd/"></div></div>
 <div class="field"><label>Перевод (RU)</label><input value="${esc(w.ru)}"></div>
 <div class="field"><label>Пример предложения</label><textarea rows="2">${esc(w.ex)}</textarea></div>
 <div class="field"><label>Отдел</label><select>${["Офис","Переговоры","Собеседование","Командировка"].map(d=>`<option ${w.dept===d?"selected":""}>${d}</option>`).join("")}</select></div>
 <div class="acts"><button class="btn paper-ghost" data-act="close">Отмена</button><button class="btn paper-ghost" data-act="saveDraft">Сохранить черновик</button><button class="btn sage" data-act="publish">Опубликовать</button></div>
 </div></div>`}

/* ---------- игра ---------- */
let timerId=null;
function startGame(){clearInterval(timerId);S.game={i:0,t:60,xp:0,ok:0,combo:0,pick:null,lastGain:0,before:S.xp};
 timerId=setInterval(()=>{if(S.screen!=="game"){clearInterval(timerId);return}S.game.t--;if(S.game.t<=0){finishGame();return}
  const tm=view.querySelector(".timer");if(tm){tm.querySelector("i").style.width=S.game.t/60*100+"%";tm.classList.toggle("low",S.game.t<=10);tm.setAttribute("aria-valuenow",S.game.t);const l=view.querySelector(".q .lbl");if(l)l.textContent="Выберите перевод · осталось "+S.game.t+" с"}},1000)}
function pick(k){const g=S.game,q=GAME[g.i];if(g.pick!=null)return;g.pick=k;
 if(k===q.a){g.combo++;g.ok++;g.lastGain=10+(g.combo>=3?5:0);g.xp+=g.lastGain}else g.combo=0;
 render();setTimeout(()=>{if(S.screen!=="game")return;g.i++;g.pick=null;if(g.i>=GAME.length)finishGame();else render()},900)}
function finishGame(){clearInterval(timerId);const g=S.game;S.xp+=g.xp;S.lastRound={ok:g.ok,total:GAME.length,gain:g.xp,before:g.before,after:S.xp};S.screen="result";render()}

/* ---------- рендер ---------- */
function render(){
  const full=FULL.includes(S.screen);
  dev.className=`device ${S.dev} ${full?"full":""}`;
  renderNav();
  view.innerHTML=screens[S.screen]()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
  $("#screenSel").value=S.screen;
  view.scrollTop=0;
}
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast=null;render()},1800)}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const d=e.target.closest("[data-dev]");if(d){S.dev=d.dataset.dev;document.querySelectorAll("[data-dev]").forEach(b=>b.setAttribute("aria-pressed",b===d));render();return}
  const o=e.target.closest("[data-opt]");if(o){pick(+o.dataset.opt);return}
  const ed=e.target.closest("[data-edit]");if(ed){S.modal=+ed.dataset.edit;render();return}
  const a=e.target.closest("[data-act]");
  if(a){const act=a.dataset.act;e.stopPropagation();
    if(act==="startGuest"){setRole("guest");go("home")}
    else if(act==="toLogin"){go("register")}
    else if(act==="sort"){S.cardIdx=(S.cardIdx+1)%8;S.flip=false;render()}
    else if(act==="say"){toast("🔊 Воспроизведение произношения")}
    else if(act==="register"){S.regErr=false;setRole("user");go("home");toast("Аккаунт создан, прогресс перенесён")}
    else if(act==="regErr"){S.regErr=true;render()}
    else if(act==="logout"){setRole("guest");go("welcome")}
    else if(act==="add"){S.modal=-1;render()}
    else if(act==="close"){S.modal=null;render()}
    else if(act==="saveDraft"){S.modal=null;toast("Черновик сохранён")}
    else if(act==="publish"){S.modal=null;toast("Слово опубликовано")}
    return}
  const f=e.target.closest("#flip");if(f){S.flip=!S.flip;f.classList.toggle("on",S.flip)}
});
document.addEventListener("keydown",e=>{const f=e.target.closest&&e.target.closest("#flip");if(f&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.flip=!S.flip;f.classList.toggle("on",S.flip)}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.filter=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{if(e.target.id==="df"){S.deptF=e.target.value;render()}});
$("#roleSel").addEventListener("change",e=>setRole(e.target.value));
$("#screenSel").addEventListener("change",e=>{const v=e.target.value;if(v==="admin")setRole("admin");go(v)});

window.proto={S,go,setRole,render,pick,setDev(d){S.dev=d;document.querySelectorAll("[data-dev]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dev===d));render()}};
render();
</script>
</body>
</html>
