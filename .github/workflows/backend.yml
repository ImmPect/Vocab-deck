name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vocab
          POSTGRES_PASSWORD: vocab
          POSTGRES_DB: vocabdeck
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vocab" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Тесты (SQLite)
        run: pytest
      - name: Миграции и начальные данные на PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://vocab:vocab@localhost:5432/vocabdeck
          ADMIN_PASSWORD: ci-admin-password
        run: |
          alembic upgrade head
          python -m app.seed
          alembic downgrade base
      - name: Тесты (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vocab:vocab@localhost:5432/vocabdeck
        run: pytest
